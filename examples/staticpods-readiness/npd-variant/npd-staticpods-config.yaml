apiVersion: v1
kind: ConfigMap
metadata:
  name: npd-staticpods-config
  namespace: kube-system
data:
  # NPD uses problem-oriented conditions.
  # StaticPodsMissing=False means all static pods are mirrored
  # StaticPodsMissing=True means some static pods are not yet mirrored
  staticpods-plugin.json: |
    {
      "plugin": "custom",
      "pluginConfig": {
        "invoke_interval": "30s",
        "timeout": "10s",
        "max_output_length": 80,
        "concurrency": 1
      },
      "source": "staticpods-monitor",
      "conditions": [
        {
          "type": "StaticPodsMissing",
          "reason": "AllStaticPodsMirrored",
          "message": "All static pods have mirror pods in API server"
        }
      ],
      "rules": [
        {
          "type": "permanent",
          "condition": "StaticPodsMissing",
          "reason": "StaticPodsNotMirrored",
          "path": "/config/plugin/check-staticpods.sh"
        }
      ]
    }
  
  check-staticpods.sh: |
    #!/bin/bash
    # Exit 0 when all static pods have mirrors (StaticPodsMissing=False)
    # Exit 1 when NOT all mirrored (StaticPodsMissing=True)
    
    set -euo pipefail
    
    STATIC_PODS_DIR="${STATIC_PODS_DIR:-/etc/kubernetes/manifests}"
    NODE_NAME="${NODE_NAME:-$(hostname)}"
    
    if [ ! -d "$STATIC_PODS_DIR" ]; then
      echo "Static pods directory $STATIC_PODS_DIR not found"
      exit 1
    fi
    
    # Check required tools
    for tool in kubectl yq jq; do
      if ! command -v $tool &> /dev/null; then
        echo "$tool not found in PATH"
        exit 1
      fi
    done
    
    parse_manifest() {
      local file="$1"
      local name namespace
      
      # Determine file type and parse accordingly
      if [[ "$file" == *.json ]]; then
        # Parse JSON with jq
        name=$(jq -r '.metadata.name // empty' "$file" 2>/dev/null)
        namespace=$(jq -r '.metadata.namespace // "kube-system"' "$file" 2>/dev/null)
      else
        # Parse YAML with yq
        name=$(yq eval '.metadata.name // ""' "$file" 2>/dev/null)
        namespace=$(yq eval '.metadata.namespace // "kube-system"' "$file" 2>/dev/null)
      fi
      
      if [ -z "$name" ]; then
        echo "WARNING: Could not parse name from $file" >&2
        return 1
      fi
      
      echo "$name|$namespace"
    }
    
    missing_pods=()
    
    while IFS= read -r manifest; do
      [ -z "$manifest" ] && continue
      
      if ! pod_info=$(parse_manifest "$manifest"); then
        continue
      fi
      
      pod_name="${pod_info%%|*}"
      pod_namespace="${pod_info##*|}"
      
      mirror_name="${pod_name}-${NODE_NAME}"
      
      if ! kubectl get pod "$mirror_name" -n "$pod_namespace" &>/dev/null; then
        missing_pods+=("$mirror_name (namespace: $pod_namespace)")
      fi
    done < <(find "$STATIC_PODS_DIR" -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) 2>/dev/null)
    
    if [ ${#missing_pods[@]} -eq 0 ]; then
      exit 0
    else
      echo "Missing mirror pods:"
      printf '  - %s\n' "${missing_pods[@]}"
      exit 1
    fi
